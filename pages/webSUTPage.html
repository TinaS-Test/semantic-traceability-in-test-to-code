<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>SUT - Semantisk Mappningsyta</title>
</head>
<body>

    <div id="error-banner" 
         class="system-state"
         data-semantic-noun="System" 
         data-semantic-adjective="Otillgänglig"
         data-semantic-trace="AC3-API-Failure-Message">
         Systemfel: Ofullständig data (Tjänsten är otillgänglig)
    </div>

    <section class="search-engine" data-semantic-noun="Sökfunktioner">
        
        <input type="text" 
               id="search-input" 
               data-semantic-verb="Nyttja" 
               data-semantic-type="Input"/>

        <button id="btn-search" 
                data-semantic-verb="Initiera" 
                data-semantic-type="Trigger">
                Exekvera Sökning
        </button>
        
    </section>

    <main class="results-view" data-semantic-noun="Logg" data-semantic-verb="Returnera">
        
        <div class="search-result-item" data-semantic-noun="Händelse" data-semantic-trace="DB-Record-1">
            <span data-semantic-noun="Översätta">Originaltext ➡️ Måltext</span>
            <span data-semantic-noun="Rapport" data-semantic-adjective="Fullständig (cykel)">Status: Success</span>
        </div>

        <div class="search-result-item" data-semantic-noun="Händelse" data-semantic-trace="DB-Record-2">
            <span data-semantic-noun="Översätta">Injektioner ➡️ Payload</span>
            <span data-semantic-noun="Rapport" data-semantic-adjective="Ofullständig (data)">Status: Failed</span>
        </div>
        
    </main>

</body>
</html>
